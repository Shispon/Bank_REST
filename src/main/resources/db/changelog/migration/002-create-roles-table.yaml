databaseChangeLog:
  - changeSet:
      id: 1
      author: Shispon
      changes:
        - createTable:
            tableName: roles
            schemaName: cards
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
