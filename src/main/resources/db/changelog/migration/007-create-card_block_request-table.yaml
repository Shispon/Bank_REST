databaseChangeLog:
  - changeSet:
      id: 6
      author: Shispon
      changes:
        - createTable:
            tableName: card_block_request
            schemaName: cards
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: card_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: text
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - addForeignKeyConstraint:
            baseTableName: card_block_request
            baseColumnNames: card_id
            baseTableSchemaName: cards
            referencedTableName: cards
            referencedColumnNames: id
            referencedTableSchemaName: cards
            constraintName: fk_card_block_request_from_card
        - addForeignKeyConstraint:
            baseTableName: card_block_request
            baseColumnNames: user_id
            baseTableSchemaName: cards
            referencedTableName: users
            referencedColumnNames: id
            referencedTableSchemaName: cards
            constraintName: fk_card_block_request_from_user
