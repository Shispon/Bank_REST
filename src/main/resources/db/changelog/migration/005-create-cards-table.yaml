databaseChangeLog:
  - changeSet:
      id: 4
      author: Shispon
      changes:
        - createTable:
            tableName: cards
            schemaName: cards
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: card_number
                  type: varchar(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: expiration
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: decimal(15,2)
                  defaultValue: 0
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: current_timestamp

        - addForeignKeyConstraint:
            baseTableSchemaName: cards
            baseTableName: cards
            baseColumnNames: user_id
            referencedTableSchemaName: cards
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cards_users_user_id
