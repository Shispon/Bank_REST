server:
  address: 0.0.0.0
  port: 8080


spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: admin
    password: 12345

  jwt:
    secret: ThisIs@Very$Secure$SecretKeyWithSymbols123
    expiration: 86400000


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          provider_disable_autocommit: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml